spring.application.name=api-gateway

server.port=8082

# Config do Eureka Client (do Gateway)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Endereco do Eureka Server (localhost:8761)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Discovery Locator (rotas dinamicas via Eureka)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# Converte o ID dos servicos registrados no Eureka
# para minusculas ao criar rotas dinamicas
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true