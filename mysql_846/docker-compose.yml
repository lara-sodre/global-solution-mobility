# Um MySQL independente para cada microsservico (bancos proprios, sem compartilhar schema/tabelas)
services:

  mysql-locais:
    container_name: mysql-locais
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_locais
    ports:
      - "3306:3306"
    volumes:
      - mysql-locais-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-avaliacoes:
    container_name: mysql-avaliacoes
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_avaliacoes
    ports:
      - "3307:3306"
    volumes:
      - mysql-avaliacoes-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-locais-data:
  mysql-avaliacoes-data:
